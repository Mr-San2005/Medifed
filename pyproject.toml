[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medifed"
version = "0.3.0"
description = "Decentralized medical diagnostics via federated learning"
license = { file = "LICENSE" }
dependencies = ["flwr>=1.36.0"]

[tool.hatch.build.targets.wheel]
packages = ["medifed"]

[tool.flwr.app]
publisher = "medifed"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "medifed.server_app:app"
clientapp = "medifed.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
run-name = "baseline_seed42"
